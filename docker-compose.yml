version: '3.8'

services:
  storemind-api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: storemind-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/qdrant_data:/app/qdrant_data
    env_file:
      - ./backend/.env
    restart: unless-stopped
    
  storemind-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: storemind-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - storemind-api
    restart: unless-stopped
